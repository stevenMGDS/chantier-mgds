<style>
/* Layout : en-tête et compteurs cliquables, liste des chantiers (une ligne = une barre de 18 étapes colorées), fiche chantier en panneau latéral. */
:root{
  --bg:#EEF0F1; --surface:#FFFFFF; --sunk:#E3E6E8; --ink:#2E3438; --muted:#5F6A73; --line:#D3D8DC;
  --accent:#1F5F8B; --accent-ink:#FFFFFF;
  --s-gris:#AEB4BA; --s-orange:#E08A52; --s-bleu:#4F88BD; --s-vert:#469A61; --s-rouge:#CC4141;
  --t-orange:#FBE3D3; --t-bleu:#DCE8F4; --t-vert:#DDF0E2; --t-rouge:#F8DADA; --t-gris:#E6E8EA;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1F22; --surface:#252A2E; --sunk:#2F353A; --ink:#E7EAEC; --muted:#9AA4AC; --line:#3A4146;
  --accent:#6FA8D6; --accent-ink:#10202C;
  --s-gris:#68707A; --s-orange:#E39A6B; --s-bleu:#6FA0CF; --s-vert:#62B47C; --s-rouge:#E06464;
  --t-orange:#4A3226; --t-bleu:#23384B; --t-vert:#213B2A; --t-rouge:#4A2526; --t-gris:#33393E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1F22; --surface:#252A2E; --sunk:#2F353A; --ink:#E7EAEC; --muted:#9AA4AC; --line:#3A4146;
  --accent:#6FA8D6; --accent-ink:#10202C;
  --s-gris:#68707A; --s-orange:#E39A6B; --s-bleu:#6FA0CF; --s-vert:#62B47C; --s-rouge:#E06464;
  --t-orange:#4A3226; --t-bleu:#23384B; --t-vert:#213B2A; --t-rouge:#4A2526; --t-gris:#33393E; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;max-width:1400px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;border-bottom:3px solid var(--ink);padding-bottom:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:34px;margin:0;line-height:1}
h1 small{display:block;font:500 14px var(--f-body);color:var(--muted);margin-top:6px}
button{font:inherit;color:inherit}
.btn{font:600 15px var(--f-body);border:0;border-radius:6px;padding:8px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 12px}
.stat{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:baseline}
.stat b{font:600 24px var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
.stat[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.stat.r b{color:var(--s-rouge)}.stat.o b{color:var(--s-orange)}.stat.bl b{color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{font:500 14px var(--f-body);border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tools input[type=search]{font:15px var(--f-body);border:1px solid var(--line);border-radius:99px;padding:6px 12px;background:var(--surface);color:var(--ink);min-width:0;flex:1 1 180px;max-width:280px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-left:auto}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:minmax(170px,1.1fr) minmax(260px,2fr) minmax(200px,1.4fr);gap:8px 20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:var(--accent)}
.row.blocked{border-left:6px solid var(--s-rouge)}
.row.late{border-left:6px solid var(--s-orange)}
@media (max-width:860px){.row{grid-template-columns:1fr}}
.client{font:700 20px var(--f-display);line-height:1.1}
.mono{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.sub{font-size:14px;color:var(--muted)}
.prog{display:flex;flex-direction:column;gap:5px;min-width:0}
.bar{display:grid;grid-template-columns:repeat(18,1fr);gap:2px;height:12px}
.bar i{border-radius:2px;background:var(--sunk);border:1px solid var(--line)}
.bar i.cur{border:2px solid var(--ink)}
.bar i.done{background:var(--s-vert);border-color:transparent}.bar i.late{background:var(--s-orange);border-color:transparent}.bar i.blk{background:var(--s-rouge);border-color:transparent}.bar i.part{background:repeating-linear-gradient(135deg,var(--s-orange) 0 3px,var(--t-orange) 3px 6px);border-color:var(--s-orange)}
.phase{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.pill{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:4px;background:var(--t-gris)}
.pill.orange{background:var(--t-orange)}.pill.bleu{background:var(--t-bleu)}.pill.vert{background:var(--t-vert)}.pill.rouge{background:var(--t-rouge)}
.next{font-size:15px;min-width:0}
.next strong{font-weight:600}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.flag{font:600 13px var(--f-body);padding:1px 8px;border-radius:4px}
.flag.r{background:var(--t-rouge)}.flag.o{background:var(--t-orange)}.flag.b{background:var(--t-bleu)}.flag.g{background:var(--t-vert)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted)}
/* panneau */
.scrim{position:fixed;inset:0;background:rgba(20,24,27,.4);z-index:19}
.sheet{position:fixed;inset:0 0 0 auto;width:min(680px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(0,0,0,.2);overflow-y:auto;z-index:20;padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) 20px}
.sheet h2{font:700 30px var(--f-display);margin:0;line-height:1.05}
.sheet .head{display:flex;justify-content:space-between;gap:12px;align-items:start}
.sheet h3{font:700 15px var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:24px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:12px}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
.fields label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.fields .wide{grid-column:1/-1}
input[type=text],input[type=email],input[type=tel],input[type=date],select,textarea{font:15px var(--f-body);border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.box{width:28px;height:28px;border-radius:6px;border:2px solid var(--muted);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0;color:#fff}
.box[aria-checked="true"]{border-color:transparent}
.box[aria-checked="true"]{background:var(--s-vert)}
.state{font:600 12px var(--f-body);padding:1px 7px;border-radius:4px;margin-left:6px}.state.late{background:var(--t-orange)}.state.blk{background:var(--t-rouge)}.state.cur{background:var(--t-gris)}
.box svg{width:16px;height:16px}
.box:disabled{cursor:default;opacity:.6}
.steps .lab{font-size:16px}
.steps .lab em{font-style:normal;font-size:12px;color:var(--muted);margin-left:6px}
.steps .date{font:14px var(--f-mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.steps input[type=date]{width:auto;font:14px var(--f-mono)}
.sem{display:inline-flex;align-items:center;gap:4px;font:14px var(--f-mono)}.sem input{width:4.2em}.sem input[data-wk="y"]{width:5.2em}
.dw{display:inline-flex;align-items:center;justify-content:flex-end}.wkb{font:600 12px var(--f-mono);color:var(--muted);margin-left:6px;white-space:nowrap}.wkb:empty{display:none}
.pdates{display:flex;flex-direction:column;align-items:flex-end;gap:2px}.pchoice{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.pchoice .btn{padding:2px 10px;font-size:13px}
.arcs{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:8px}
.arc{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.arc.ok{border-left-color:var(--s-vert)}
.arch{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.arch .x{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;padding:2px 6px}
.arcf{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:end}
.arcf label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.arck{display:flex;align-items:center;gap:6px;font-size:15px}
.state.ok{background:var(--t-vert)}
.arcadd{display:flex;gap:6px;flex-wrap:wrap}.arcadd input,.arcadd select{flex:1 1 120px;min-width:0}
.arc.part{border-left-color:var(--orange,#d98b2b)}
.tasks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.tasks{grid-template-columns:1fr}}
.tasks section{background:var(--sunk);border-radius:8px;padding:10px 12px;min-width:0}
.tasks h4{font:700 14px var(--f-display);text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px}
.task{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:start;padding:3px 0;font-size:15px}
.task input{width:18px;height:18px;margin-top:2px;accent-color:var(--s-vert)}
.task.done span{text-decoration:line-through;color:var(--muted)}
.task .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.add{display:flex;gap:6px;margin-top:6px}
.add .btn{padding:6px 10px}
.drop{border:2px dashed var(--line);border-radius:8px;padding:16px;text-align:center;color:var(--muted);font-size:15px}
.drop.over{border-color:var(--accent);background:var(--t-bleu)}
.drop label{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline}
.docs{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.docs li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--sunk);border-radius:6px;padding:6px 10px;min-width:0}
.doclink{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-align:left;cursor:pointer;text-decoration:underline;overflow-wrap:anywhere}
.viewer{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.viewer .vbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.viewer .vbar b{font:700 18px var(--f-display);min-width:0;overflow-wrap:anywhere}
.viewer .pages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.viewer canvas,.viewer img{max-width:100%;height:auto;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.docs select{width:auto;font-size:13px;padding:3px 6px}
.dtype{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:4px;background:var(--t-bleu)}
.new{font:600 11px var(--f-body);color:var(--s-orange);margin-left:6px;text-transform:uppercase}.new.ok{color:var(--s-vert)}
.viewer .pg{position:relative;max-width:100%}.viewer .pg canvas{display:block}
.viewer .fld{position:absolute;box-sizing:border-box;margin:0;border:1px solid var(--accent);border-radius:2px;background:rgba(220,232,244,.85);color:#111;padding:0 2px;font-family:var(--f-body);resize:none}
.viewer .fldro{position:absolute;color:#111;font-family:Helvetica,Arial,sans-serif;line-height:1.15;padding:1px 2px;pointer-events:none;white-space:pre-wrap}
.viewer .fld.opt{background:rgba(220,232,244,.35);border-style:dashed}
.viewer .fld.need{background:rgba(255,236,150,.9);border-color:var(--s-orange)}
.viewer input.fld[type=checkbox]{appearance:none;-webkit-appearance:none;cursor:pointer;padding:0}
.viewer input.fld[type=checkbox]:checked{background:var(--accent);box-shadow:inset 0 0 0 2px #fff}
.viewer .fld:focus{outline:2px solid var(--accent);outline-offset:1px}
#vfill{font:600 13px var(--f-body);color:var(--s-orange)}#vfill.ok{color:var(--s-vert)}
.mails{display:flex;flex-direction:column;gap:6px}
.mail{border:1px solid var(--line);border-radius:6px}
.mail summary{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 10px;cursor:pointer;list-style:none;align-items:center}
.mail summary::-webkit-details-marker{display:none}
.mail .body{padding:0 12px 12px}
.mail pre{white-space:pre-wrap;font:15px/1.5 var(--f-body);margin:6px 0 10px;background:var(--sunk);padding:10px;border-radius:6px}
.mail .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ctl li{padding:6px 10px;border-radius:6px;background:var(--t-bleu);font-size:15px}
.ctl li.alerte{background:var(--t-rouge)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;z-index:30;font-size:15px}
.who-by{font-size:12px;color:var(--muted);margin-left:6px}
@media (prefers-reduced-motion:no-preference){.row,.stat,.box{transition:border-color .15s,background .15s}}
</style>

<div class="wrap">
  <header class="top">
    <h1>Chantiers MGDS<small id="sum">Chargement des chantiers…</small></h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="newBtn" hidden>Nouveau chantier</button></div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="tools">
    <div id="chips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <input type="search" id="q" placeholder="Chercher un client, un n° de devis">
    <div class="legend"><span><i style="background:var(--s-vert)"></i>fait</span><span><i style="background:var(--s-orange)"></i>en retard</span><span><i style="background:var(--s-rouge)"></i>bloqué</span><span><i style="background:var(--sunk);border:2px solid var(--ink)"></i>étape en cours</span><span><i style="background:var(--sunk);border:1px solid var(--line)"></i>à venir</span></div>
  </div>
  <div class="list" id="list"><div class="empty">Chargement…</div></div>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden aria-label="Fiche chantier"></aside>
<div class="viewer" id="viewer" hidden><div class="vbar"><b id="vname"></b><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span id="vfill" role="status"></span><button class="btn ghost" id="vnext" hidden>Case vide suivante</button><button class="btn" id="vedit" hidden>Remplir la fiche</button><button class="btn" id="vsave" hidden>Enregistrer</button><button class="btn ghost" id="vdl" hidden>Télécharger</button><button class="btn" id="vclose">Fermer</button></span></div><div class="pages" id="vpages"></div></div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// Chantiers MGDS, version autonome : remplace les services claude.ai (base, utilisateur, documents, téléchargement) par Supabase.
// L'appli elle-même (chantiers-mgds.html) reste identique ; ce fichier est injecté avant son script par build.sh.
(()=>{
const SB_URL="https://azgvzgenfykvlkuwevty.supabase.co";
const SB_KEY="sb_publishable_Is-KNNP223DIxMk8kzrYww_PynSCb23"; // clé publique, faite pour le navigateur : les droits sont contrôlés par la base
const BUCKET="documents";
// lien d'invitation ou de mot de passe oublié : à lire avant que supabase-js ne nettoie l'adresse
const fromLink=/type=(invite|recovery|signup)/.test(location.hash)||/type=(invite|recovery)/.test(location.search);
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
window.sbClient=sb;

let session=null,profil=null,readyRes;
const ready=new Promise(r=>readyRes=r);
const err=(code,msg)=>Object.assign(new Error(msg||code),{code});

// ---------- écran de connexion ----------
const css=`.gate{position:fixed;inset:0;z-index:100;background:var(--bg,#EEF0F1);display:grid;place-items:center;padding:16px}
.gate form{background:var(--surface,#fff);border:1px solid var(--line,#D3D8DC);border-radius:12px;padding:24px;width:min(380px,100%);display:grid;gap:12px;font-family:var(--f-body,Arial,sans-serif);color:var(--ink,#2E3438)}
.gate h1{margin:0;font:700 26px var(--f-display,Arial)}.gate p{margin:0;color:var(--muted,#5F6A73);font-size:14px}
.gate label{display:grid;gap:4px;font-size:13px;font-weight:600}
.gate input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line,#D3D8DC);border-radius:8px;background:var(--surface,#fff);color:inherit}
.gate button{font:600 15px var(--f-body,Arial);padding:11px;border-radius:8px;border:0;background:var(--accent,#1F5F8B);color:var(--accent-ink,#fff);cursor:pointer}
.gate button.link{background:none;color:var(--accent,#1F5F8B);padding:4px;font-weight:500}
.gate .msg{min-height:1.2em;font-size:14px;color:var(--s-rouge,#CC4141)}.gate .msg.ok{color:var(--s-vert,#469A61)}
.who{position:fixed;right:12px;bottom:12px;z-index:30;font:500 12px var(--f-body,Arial);background:var(--surface,#fff);border:1px solid var(--line,#D3D8DC);border-radius:999px;padding:6px 10px;color:var(--muted,#5F6A73);display:flex;gap:8px;align-items:center}
.who button{font:inherit;background:none;border:0;color:var(--accent,#1F5F8B);cursor:pointer;padding:0}`;
document.head.insertAdjacentHTML("beforeend",`<style>${css}</style>`);

function gate(mode,note){
  document.querySelector(".gate")?.remove();
  const g=document.createElement("div");g.className="gate";
  const pw=mode==="setpw";
  g.innerHTML=`<form novalidate><h1>Chantiers MGDS</h1>
   <p>${pw?"Choisissez votre mot de passe (8 caractères minimum).":"Connectez-vous avec l'adresse e-mail que Steven a enregistrée."}</p>
   ${pw?"":`<label>E-mail<input type="email" name="email" autocomplete="username" required></label>`}
   <label>${pw?"Nouveau mot de passe":"Mot de passe"}<input type="password" name="pw" autocomplete="${pw?"new-password":"current-password"}" minlength="8" required></label>
   <button type="submit">${pw?"Enregistrer et entrer":"Se connecter"}</button>
   ${pw?"":`<button type="button" class="link" data-lien>Première connexion ou mot de passe oublié</button>`}
   <div class="msg" role="status">${note||""}</div></form>`;
  document.body.appendChild(g);
  const f=g.querySelector("form"),msg=g.querySelector(".msg"),say=(t,ok)=>{msg.textContent=t;msg.className="msg"+(ok?" ok":"")};

const isObj=v=>v&&typeof v==="object"&&!Array.isArray(v);

const okTerrain=p=>Object.keys(p).every(k=>k==="docs"||k==="av"||k==="ap"||(k==="steps"&&isObj(p.steps)&&Object.keys(p.steps).every(s=>["metre","prepa","recep"].includes(s))));
function merge(a,b){const o=isObj(a)?{...a}:{};for(const[k,v]of Object.entries(b))o[k]=isObj(v)&&isObj(o[k])?merge(o[k],v):v;return o}
function docRef(path){
  const id=path.split("/")[1];
  return{
    async update(patch){
      if(profil.role!=="editeur"&&!(profil.role==="terrain"&&okTerrain(patch)))throw err("invalid_argument");
      for(let n=0;n<6;n++){
        const {data:row,error:e1}=await sb.from("chantiers").select("data,version").eq("id",id).single();
        if(e1)throw err("unavailable",e1.message);
        const {data:upd,error:e2}=await sb.from("chantiers").update({data:merge(row.data,patch)}).eq("id",id).eq("version",row.version).select("id");
        if(e2)throw err(/size|too large/i.test(e2.message)?"quota_exceeded":"unavailable",e2.message);
        if(upd&&upd.length)return;
        // quelqu'un a écrit entre-temps : on relit et on refusionne
      }
      throw err("unavailable","conflit");
    },
    async set(doc){
      if(profil.role!=="editeur")throw err("invalid_argument");
      const {error}=await sb.from("chantiers").insert({id,data:doc});
      if(error)throw err("unavailable",error.message);
    }
  };
}
const db={
  doc:docRef,
  collection(){return{onSnapshot(cb,onErr){
    const rows=new Map();
    const emit=()=>cb({docs:[...rows].map(([id,d])=>({id,data:()=>d}))});
    let ch;
    (async()=>{
      const {data,error}=await sb.from("chantiers").select("id,data");
      if(error){onErr&&onErr(error);return}
      data.forEach(r=>rows.set(r.id,r.data));emit();
      ch=sb.channel("chantiers").on("postgres_changes",{event:"*",schema:"public",table:"chantiers"},p=>{
        if(p.eventType==="DELETE")rows.delete(p.old.id);else rows.set(p.new.id,p.new.data);emit();
      }).subscribe();
    })();
    // au retour sur l'onglet (téléphone en veille), on recharge tout au cas où le temps réel aurait décroché
    document.addEventListener("visibilitychange",async()=>{
      if(document.hidden)return;
      const {data}=await sb.from("chantiers").select("id,data");
      if(data){rows.clear();data.forEach(r=>rows.set(r.id,r.data));emit()}
    });
    return()=>ch&&sb.removeChannel(ch);
  }}}
};

const assets={
  async upload(f,{type}={}){
    if(f.size>20*1024*1024)throw err("too_large");
    const safe=f.name.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w.-]+/g,"_").slice(-80);
    const rid=crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10);
    const path=`app/${rid}-${safe}`;
    const {error}=await sb.storage.from(BUCKET).upload(path,f,{contentType:type||f.type||"application/octet-stream",upsert:false});
    if(error)throw err(/quota|exceed/i.test(error.message)?"quota_or_state":"failed",error.message);
    return{id:path,sizeBytes:f.size};
  }
};
// l'appli lit un document par fetch("/_blob/<id>") : on le sert depuis le stockage Supabase
const nativeFetch=window.fetch.bind(window);
window.fetch=async(u,o)=>{
  if(typeof u==="string"&&u.startsWith("/_blob/")){
    const {data,error}=await sb.storage.from(BUCKET).download(decodeURIComponent(u.slice(7)));
    return error?new Response(null,{status:404}):new Response(data,{status:200,headers:{"Content-Type":data.type||""}});
  }
  return nativeFetch(u,o);
};

const downloads={
  async save({filename,data}){
    const a=document.createElement("a");a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  }
};

const services={db,user,assets,downloads};
window.claude={use:async name=>{await ready;return services[name]||null}};
})();

 ["acompte","Acompte reçu","Votre commande est confirmée","Bonjour {nom},\n\nNous avons bien reçu votre acompte : votre projet est lancé.\n\nProchaine étape : Yannick, notre métreur, viendra prendre les mesures définitives. Marine vous appelle dans les prochains jours pour fixer le rendez-vous.\n\nBien cordialement,\nL'équipe MGDS"],

function nextOf(j,c){

  if(hasArcs(j)&&c==="livre")return"Réceptionner le matériel : "+arcCount(j,a=>a.livre&&a.livre.d)+" livraisons reçues";

  return NEXT[c]||SK[c].l}

const chains={};
function save(id,patch){
  if(!db)return Promise.resolve();
  const ref=db.doc("chantiers/"+id);
  chains[id]=(chains[id]||Promise.resolve()).then(()=>ref.update(patch)).catch(e=>{
    if(e&&e.code==="invalid_argument"){canWrite=false;toast("Vous pouvez consulter mais pas modifier cette page.")}
    else if(e&&e.code==="quota_exceeded")toast("La base est pleine : prévenez Steven.");
    else toast("Enregistrement impossible, réessayez dans un instant.");
  });
  return chains[id];
}
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3200)}

const ADDR_DOCS=["Préparation","Métré","Réception"];
// polices standard du PDF : pas d'apostrophe typographique ni de œ
function clean(s){return (s||"").trim().replace(/[’‘]/g,"'").replace(/œ/g,"oe").replace(/Œ/g,"OE")}
function addrOf(j){const a=(j.adresse||"").trim(),v=(j.ville||"").trim();return clean(a&&v&&a.toLowerCase().includes(v.toLowerCase())?a:[a,v].filter(Boolean).join(" - "))}
async function withAddress(blob,d){
  const j=jobs.get(openId)||{};
  // champ du PDF -> valeur de la fiche (vide : on garde ce qui vient du devis)
  const vals=[["adresse_chantier",addrOf(j),0],["client_nom",clean(j.clientNom),1],["client_adresse",clean(j.clientAdresse),0]].filter(v=>v[1]);
  if(!vals.length||!ADDR_DOCS.includes(d.type)||!window.PDFLib)return blob;
  try{
    const doc=await PDFLib.PDFDocument.load(await blob.arrayBuffer());
    const all=doc.getForm().getFields();
    const fs=vals.flatMap(([n,v,b])=>all.filter(f=>f.getName().startsWith(n+"_")).map(f=>[f,v,b]));
    if(!fs.length)return blob;
    const font=await doc.embedFont(PDFLib.StandardFonts.Helvetica),bold=await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);
    fs.forEach(([f,v,b])=>{f.setText(v);f.setFontSize(8);f.updateAppearances(b?bold:font)});
    return new Blob([await doc.save()],{type:"application/pdf"});
  }catch(_){return blob}
}

      if(/^(client_nom|client_adresse|adresse_chantier)_/.test(a.fieldName)){
        // nom et adresses : écrits depuis la fiche chantier, affichés tels quels
        if(a.fieldValue){const t=document.createElement("div");t.className="fldro";t.textContent=a.fieldValue;Object.assign(t.style,{left:L+"px",top:T+"px",width:W+"px",fontSize:8*P.css+"px",fontWeight:/^client_nom/.test(a.fieldName)?"700":"400"});P.box.appendChild(t)}
        continue}
      const cb=a.fieldType==="Btn",multi=!cb&&Math.abs(a.rect[3]-a.rect[1])>45;
      const el=document.createElement(multi?"textarea":"input");el.className="fld";
      if(cb){el.type="checkbox";el.checked=!!a.fieldValue&&a.fieldValue!=="Off"}else{if(!multi)el.type="text";el.value=a.fieldValue||"";el.style.fontSize=Math.max(9,Math.min(16,H*.68))+"px"}
      Object.assign(el.style,{left:L+"px",top:T+"px",width:W+"px",height:H+"px"});el.setAttribute("aria-label",a.alternativeText||a.fieldName);
      P.box.appendChild(el);
      fields.push({name:a.fieldName,cb,multi,el,pi,cy:(a.rect[1]+a.rect[3])/2,x:Math.min(a.rect[0],a.rect[2])});
    }
    P.labels=(await P.page.getTextContent()).items.filter(t=>/:\s*$|:\s/.test(t.str)).map(t=>({x:t.transform[4],y:t.transform[5]}));
  }
  const rowKey=f=>f.pi+":"+Math.round(f.cy/5);
  const near=(f,g)=>f.pi===g.pi&&Math.abs(f.cy-g.cy)<4;
  const cbs=fields.filter(f=>f.cb);
  // une ligne de cases se découpe en groupes à chaque libellé « xxx : » (ex. Habillage : … Sens : …) ; options de l'annexe groupées par page
  let gn=0;
  cbs.forEach(f=>{const m=/^opt_(\d+)_/.exec(f.name);if(m)f.group="opt"+m[1]});
  const rest=cbs.filter(f=>!f.group).sort((a,b)=>a.pi-b.pi||b.cy-a.cy||a.x-b.x);
  rest.forEach((f,k)=>{const g=rest.slice(0,k).reverse().find(o=>near(f,o));
    const cut=g&&vPages[f.pi].labels.some(t=>Math.abs(t.y-f.cy)<7&&t.x>g.x&&t.x<f.x);
    f.group=g&&!cut?g.group:"g"+(++gn)});
  // texte obligatoire, sauf remarques, grands cadres, et petit champ collé juste après une case (« autre : … », nombre de grilles, remarque d'un contrôle)
  fields.forEach(f=>{if(!f.cb)f.req=!f.multi&&!/^rem_/.test(f.name)&&!cbs.some(g=>!/^opt_/.test(g.name)&&near(f,g)&&g.x<f.x&&f.x-g.x<40)});
  fields.forEach(f=>{if(!f.cb&&!f.req)f.el.classList.add("opt")});
  vForm={fields,dirty:false,saving:false};
  P0:{const upd=()=>{let n=0;const groups={};
    fields.forEach(f=>{if(f.cb){(groups[f.group]=groups[f.group]||[]).push(f)}else{const need=f.req&&!f.el.value.trim();f.el.classList.toggle("need",need);if(need)n++}});
    Object.values(groups).forEach(g=>{const need=!g.some(f=>f.el.checked);g.forEach(f=>f.el.classList.toggle("need",need));if(need)n++});
    vForm.reste=n;vForm.total=fields.filter(f=>f.req).length+Object.keys(groups).length;showFill(n)};
    fields.forEach(f=>f.el.addEventListener(f.cb?"change":"input",()=>{vForm.dirty=true;upd()}));upd()}
  $("vsave").hidden=false;toast("Touchez une case pour la remplir. Les cases en jaune sont obligatoires.");
}
async function saveFill(){
  if(!vForm||vForm.saving)return;const id=openId,d0=vDoc;if(!id||!d0)return;
  vForm.saving=true;$("vsave").disabled=true;toast("Enregistrement de la fiche…");
  try{
    const doc=await PDFLib.PDFDocument.load(await vBlob.arrayBuffer());const form=doc.getForm();
    const font=await doc.embedFont(PDFLib.StandardFonts.Helvetica);
    for(const f of vForm.fields){try{
      if(f.cb){const c=form.getCheckBox(f.name);f.el.checked?c.check():c.uncheck()}
      else form.getTextField(f.name).setText(f.el.value.replace(/[^\x20-\x7E\xA0-\xFF\n€œŒ’‘“”–—…]/g,""))
    }catch(_){}}
    form.updateFieldAppearances(font);
    const file=new File([await doc.save()],d0.name,{type:"application/pdf"});
    const r=await assets.upload(file,{type:"application/pdf"});
    const j=jobs.get(id)||{},docs=(j.docs||[]).map(x=>({...x}));
    const i=docs.findIndex(x=>x.id===d0.id);
    const nd={...d0,id:r.id,size:r.sizeBytes,at:today(),by:me||"",traite:false,rempli:{reste:vForm.reste,total:vForm.total,le:today()}};
    if(i>=0)docs[i]=nd;else docs.push(nd);
    const patch={docs},k=FORM_TYPES[d0.type];
    if(k&&vForm.reste===0&&!sd(j,k)&&stepsOf(j).some(s=>s.k===k))patch.steps={[k]:{d:today(),by:me||""}};
    jobs.set(id,{...j,docs,steps:{...(j.steps||{}),...(patch.steps||{})}});vDoc=nd;vBlob=file;vForm.dirty=false;
    await save(id,patch);renderSheet();render();
    toast(vForm.reste?"Fiche enregistrée. Il reste "+vForm.reste+" case"+(vForm.reste>1?"s":"")+" à remplir.":patch.steps?"Fiche complète et enregistrée : l'étape « "+SK[k].l+" » est cochée.":"Fiche complète et enregistrée.");
  }catch(e){toast("La fiche n'a pas pu être enregistrée. Réessayez.")}
  finally{if(vForm)vForm.saving=false;$("vsave").disabled=false}
}

// ---------- démarrage ----------
(async()=>{
  db=await claude.use("db");
  if(!db){$("sum").textContent="Connectez-vous à claude.ai pour voir les chantiers.";$("list").innerHTML=`<div class="empty">Les chantiers s'affichent quand vous ouvrez cette page connecté à votre compte claude.ai.</div>`;return}
  user=await claude.use("user");
  if(user){me=await user.id();const c=await user.can("data.write");if(c===false)canWrite=false;if(!canWrite){try{canFill=(await user.can("data.fill"))===true}catch(_){}}}
  assets=canWrite||canFill?await claude.use("assets"):null;
  downloads=await claude.use("downloads");
  $("newBtn").hidden=!canWrite;
  db.collection("chantiers").onSnapshot(snap=>{
    jobs=new Map(snap.docs.map(d=>[d.id,d.data()]));render();
    if(openId&&openId!=="__new"){
      if(document.activeElement&&$("sheet").contains(document.activeElement)&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))pendingSheet=true;
      else renderSheet();
    }
  },err=>{$("list").innerHTML=`<div class="empty">Les chantiers ne peuvent pas s'afficher pour le moment. Rechargez la page.</div>`});
})();
$("sheet").addEventListener("focusout",()=>{if(pendingSheet){pendingSheet=false;setTimeout(()=>{if(!$("sheet").contains(document.activeElement))renderSheet()},50)}});
</script>
