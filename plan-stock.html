<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan du stock MGDS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : bandeau d'outils en haut, scène 3D plein cadre, fiche de la zone touchée à droite (en bas sur téléphone). */
:root{
  --bg:#E9ECEE; --surface:#FFFFFF; --ink:#262C31; --muted:#5E6A73; --line:#CDD4D9;
  --accent:#1F5F8B; --pose:#2F7FC1; --atelier:#D9772B; --garage:#6B8E4E; --hl:#E8B21A;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif; --f-body:"Barlow","Helvetica Neue",Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171B1E;--surface:#22282C;--ink:#E6EAEC;--muted:#9AA5AD;--line:#363E44;--accent:#6FA8D6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171B1E;--surface:#22282C;--ink:#E6EAEC;--muted:#9AA5AD;--line:#363E44;--accent:#6FA8D6;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);box-shadow:0 1px 8px rgba(0,0,0,.05);position:relative;z-index:2}
h1{font:700 24px var(--f-display);margin:0;letter-spacing:.01em}
h1 small{font:500 13px var(--f-body);color:var(--muted);margin-left:8px}
.grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font:600 14px var(--f-body);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:18px;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
#q{font:15px var(--f-body);border:1.5px solid var(--line);border-radius:18px;padding:7px 12px;background:var(--surface);color:var(--ink);min-width:0;flex:1 1 200px;max-width:320px}
main{flex:1;display:flex;min-height:0;position:relative}
#scene{flex:1;min-width:0;position:relative;touch-action:none;background:radial-gradient(120% 100% at 50% 0%,#2B3743 0%,#151C23 60%,#0D1217 100%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #scene{background:radial-gradient(120% 90% at 50% 15%,#2A3136 0%,#1A1F22 75%)}}
:root[data-theme="dark"] #scene{background:radial-gradient(120% 90% at 50% 15%,#2A3136 0%,#1A1F22 75%)}
#scene canvas{display:block}
aside{width:min(380px,100%);background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:10px}
aside h2{font:700 26px var(--f-display);margin:0;display:flex;gap:10px;align-items:baseline}
aside h2 .code{font:500 15px var(--f-mono);color:var(--muted)}
.tag{display:inline-block;font:600 12px var(--f-body);padding:1px 8px;border-radius:9px;color:#fff}
.tag.pose{background:var(--pose)}.tag.atelier{background:var(--atelier)}.tag.garage{background:var(--garage)}.tag.autre{background:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.warn{font-size:13px;background:color-mix(in srgb,var(--hl) 22%,transparent);border-left:3px solid var(--hl);padding:6px 10px;border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}td,th{border-bottom:1px solid var(--line);padding:4px 4px;text-align:left;vertical-align:top}th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);white-space:nowrap}
.list{display:flex;flex-direction:column;gap:4px}
.list button{display:flex;justify-content:space-between;gap:8px;text-align:left;font:15px var(--f-body);background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:7px 10px;cursor:pointer}
.list button small{color:var(--muted);font-family:var(--f-mono)}
.help{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:10px;font-size:12.5px;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:4px 10px;border-radius:12px;pointer-events:none}
@media (max-width:760px){h1 small{display:none}header{gap:6px 8px}.chip{padding:4px 10px;min-height:32px;font-size:13px}main{flex-direction:column}aside{width:100%;max-height:34%;border-left:0;border-top:1px solid var(--line)}#scene .help{display:none}header{padding-block:6px}h1{font-size:20px}#q{flex-basis:100%;max-width:none;padding:5px 12px}#scene{min-height:0}}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#face{position:absolute;left:10px;right:10px;bottom:10px;max-height:58%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:3}
#face[hidden]{display:none}
#face .fh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
#face .fh b{font:700 17px var(--f-display)}
#face .fs{overflow:auto;padding:8px 10px;min-height:0}
#face svg{display:block;width:100%;height:auto;max-height:46vh;min-width:420px}
#face .bayb{fill:var(--bg);stroke:var(--muted);stroke-width:1.5}
#face .bay{cursor:pointer}#face .bay.on .bayb{fill:color-mix(in srgb,var(--hl) 30%,var(--bg));stroke:var(--hl);stroke-width:3}
#face .bay:hover .bayb{stroke:var(--accent)}
#face .shelf{fill:var(--muted);opacity:.55}
#face .rod{fill:var(--atelier);opacity:.85}
#face text{font:500 12px var(--f-body);fill:var(--ink)}#face text.ce{fill:var(--muted);font-style:italic;font-size:11px}#face text.ct{font:500 11.5px var(--f-mono)}
#face text.lb{font:600 12px var(--f-body);fill:var(--muted)}#face text.lb.on{fill:var(--ink);font-weight:700}#face text.lv{font:500 11px var(--f-mono);fill:var(--muted)}
@media (max-width:760px){#face{left:6px;right:6px;bottom:6px;max-height:70%}}
#go{position:absolute;left:0;right:0;bottom:8px;display:flex;gap:6px;overflow-x:auto;padding:4px 12px;scrollbar-width:none;z-index:3;-webkit-overflow-scrolling:touch}
#walkhelp{position:absolute;left:50%;transform:translateX(-50%);top:8px;background:rgba(20,26,32,.82);color:#fff;font-size:13px;padding:5px 12px;border-radius:14px;pointer-events:none;z-index:3;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}#walkhelp[hidden]{display:none}#scene.walking .help{display:none}
#go::-webkit-scrollbar{display:none}#go .chip{flex:0 0 auto;box-shadow:0 2px 8px rgba(0,0,0,.35);border-color:transparent}
#scene .help{bottom:auto!important;top:8px}
</style>
<header>
  <a class="chip" href="./" style="text-decoration:none">← Appli</a><h1>Plan du stock<small>Atelier, mezzanine et garage · version 4 · atelier éclairé, balade guidée</small></h1>
  <div class="grp" role="group" aria-label="Afficher">
    <button class="chip" data-f="tout" aria-pressed="true">Tout</button>

</header>

</main>
