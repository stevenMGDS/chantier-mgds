<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F5F8B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Poseurs MGDS">
<link rel="manifest" href="manifest-poseurs.json?v=2">
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<title>Poseurs MGDS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Espace poseurs : planning de la semaine, fiche chantier (fiches PDF, photos, consommables), heures. Vue gestion pour Marine / Steven. */
:root{
  --bg:#EEF0F1; --surface:#FFFFFF; --sunk:#E3E6E8; --ink:#2E3438; --muted:#5F6A73; --line:#D3D8DC;
  --accent:#1F5F8B; --accent-ink:#FFFFFF;
  --s-orange:#E08A52; --s-vert:#469A61; --s-rouge:#CC4141;
  --t-orange:#FBE3D3; --t-bleu:#DCE8F4; --t-vert:#DDF0E2; --t-rouge:#F8DADA;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1F22; --surface:#252A2E; --sunk:#2F353A; --ink:#E7EAEC; --muted:#9AA4AC; --line:#3A4146;
  --accent:#6FA8D6; --accent-ink:#10202C; --s-orange:#E39A6B; --s-vert:#62B47C; --s-rouge:#E06464;
  --t-orange:#4A3226; --t-bleu:#23384B; --t-vert:#213B2A; --t-rouge:#4A2526; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1F22; --surface:#252A2E; --sunk:#2F353A; --ink:#E7EAEC; --muted:#9AA4AC; --line:#3A4146;
  --accent:#6FA8D6; --accent-ink:#10202C; --s-orange:#E39A6B; --s-vert:#62B47C; --s-rouge:#E06464;
  --t-orange:#4A3226; --t-bleu:#23384B; --t-vert:#213B2A; --t-rouge:#4A2526; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding:16px max(16px,env(safe-area-inset-right)) 96px max(16px,env(safe-area-inset-left));max-width:1100px;margin:0 auto}
header.top{display:flex;justify-content:space-between;align-items:end;gap:12px;border-bottom:3px solid var(--ink);padding-bottom:10px;padding-top:env(safe-area-inset-top)}
h1{font:700 30px var(--f-display);margin:0;line-height:1}
h1 small{display:block;font:500 15px var(--f-body);color:var(--muted);margin-top:4px}
h2{font:700 22px var(--f-display);margin:22px 0 8px}
h3{font:700 19px var(--f-display);margin:18px 0 6px}
.sub{color:var(--muted);font-size:15px}
.mono{font-family:var(--f-mono);font-size:14px}
.btn{font:600 16px var(--f-body);border:0;border-radius:8px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:44px}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.big{width:100%;font-size:18px;padding:14px}
.btn.small{min-height:34px;padding:6px 10px;font-size:14px}
.btn.danger{background:var(--s-rouge);color:#fff}
.btn:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;padding:12px 4px;font:600 16px var(--f-body);color:var(--muted);cursor:pointer;border-top:3px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--accent);border-top-color:var(--accent)}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 6px}
.weeknav b{font:700 20px var(--f-display);text-align:center}
.weeknav .btn{min-width:48px}
.day{margin-top:14px}
.day-h{font:600 15px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.day.today .day-h{color:var(--accent)}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.day.today .card{border-left:6px solid var(--accent)}
.card.atel,.day.today .card.atel{background:var(--t-orange);border-left:6px solid var(--s-orange)}
.client{font:700 21px var(--f-display);line-height:1.15}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:14px 16px;color:var(--muted)}
.none{color:var(--muted);font-size:15px;padding:2px 0 4px}
.tot{display:flex;justify-content:space-between;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:10px 0}
.tot b{font:600 26px var(--f-mono)}
.hline{display:grid;grid-template-columns:1fr auto;gap:2px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:6px;width:100%;text-align:left;cursor:pointer}
.hline .h{font:600 18px var(--f-mono);text-align:right}
.hline.ok{border-left:6px solid var(--s-vert)}
.tag{display:inline-block;font:600 12px var(--f-body);padding:2px 8px;border-radius:99px;background:var(--t-vert);color:var(--ink);vertical-align:2px}
.tag.o{background:var(--t-orange)}.tag.b{background:var(--t-bleu)}
/* fiche chantier */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.sheet .bar b{flex:1;font:700 20px var(--f-display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.links a{text-decoration:none}
.docs{display:grid;gap:8px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:12px}
.box h3{margin-top:0}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin:10px 0}
.thumbs button{padding:0;border:0;background:var(--sunk);border-radius:6px;aspect-ratio:1;overflow:hidden;cursor:pointer;position:relative}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .cap{position:absolute;left:0;right:0;bottom:0;font:600 11px var(--f-body);background:rgba(0,0,0,.55);color:#fff;padding:2px 4px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
label.fld{display:grid;gap:4px;font-size:15px;font-weight:600;margin-top:10px}
label.fld input,label.fld select,label.fld textarea{font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:44px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* fenêtres */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--bg);width:min(560px,100%);max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.modal>div{border-radius:14px}}
.modal h2{margin-top:0}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.acts .btn{flex:1}
.lightbox{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column}
.lightbox img{flex:1;min-height:0;object-fit:contain;width:100%}
.lightbox .lb{display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;color:#fff;font-size:14px}
.lightbox .lb span{flex:1}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:15px;max-width:calc(100% - 32px);text-align:center}
/* gestion */
.gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.plan{border-collapse:collapse;width:100%;min-width:760px}
table.plan th,table.plan td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px;vertical-align:top;text-align:left;font-size:14px}
table.plan th{font:600 14px var(--f-body);color:var(--muted);background:var(--sunk)}
table.plan th.today{color:var(--accent)}
table.plan td.name{font-weight:700;white-space:nowrap;background:var(--sunk)}
.pchip{display:flex;align-items:center;gap:4px;background:var(--t-bleu);border-radius:6px;padding:3px 4px 3px 8px;margin-bottom:4px;font-size:13px;line-height:1.2}
.pchip span{flex:1;min-width:0}
.pchip.pret{background:var(--t-rouge,#F8DADA);border-left:6px solid var(--s-rouge,#CC4141)}.atlrow td{background:var(--sunk)}
.pchip.atel,.pchip.atel[style]{background:var(--t-orange)!important;border-left:6px solid var(--s-orange)}
.pchip button{border:0;background:none;cursor:pointer;font-size:16px;padding:0 4px;color:var(--muted)}
.add{border:1px dashed var(--line);background:none;border-radius:6px;width:100%;padding:4px;cursor:pointer;color:var(--muted)}
table.h{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
table.h th,table.h td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.h td.n,table.h th.n{text-align:right;font-family:var(--f-mono)}
table.h tr.sum td{font-weight:700;background:var(--sunk)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font:500 14px var(--f-body);border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.who{bottom:calc(64px + env(safe-area-inset-bottom))!important}
/* intégré dans la page d'accueil (poseurs.html?embed=1) : pas d'en-tête ni de badge, fond de la page parente */
html.embed body{background:transparent}html.embed header.top,html.embed .who{display:none!important}html.embed .wrap{padding-top:0}
/* remplissage d'une fiche PDF (même logique que l'appli Chantiers) */
.viewer{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.viewer .vbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.viewer .vbar b{font:700 18px var(--f-display);min-width:0;overflow-wrap:anywhere}
.viewer .pages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;-webkit-overflow-scrolling:touch}
.viewer canvas{max-width:100%;height:auto;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.viewer .pg{position:relative;max-width:100%}.viewer .pg canvas{display:block}
.viewer .fld{position:absolute;box-sizing:border-box;margin:0;border:1px solid var(--accent);border-radius:2px;background:rgba(220,232,244,.85);color:#111;padding:0 2px;font-family:var(--f-body);resize:none}
.viewer .fldro{position:absolute;color:#111;font-family:Helvetica,Arial,sans-serif;line-height:1.15;padding:1px 2px;pointer-events:none;white-space:pre-wrap}
.viewer .fld.opt{background:rgba(220,232,244,.35);border-style:dashed}
.viewer .fld.need{background:rgba(255,236,150,.9);border-color:var(--s-orange)}
.viewer input.fld[type=checkbox]{appearance:none;-webkit-appearance:none;cursor:pointer;padding:0}
.viewer input.fld[type=checkbox]:checked{background:var(--accent);box-shadow:inset 0 0 0 2px #fff}
#vfill{font:600 14px var(--f-body);color:var(--s-orange)}#vfill.ok{color:var(--s-vert)}
</style>

</head>
<body>
<div class="wrap" id="app" hidden>
  <header class="top"><h1>Poseurs MGDS<small id="hello"></small></h1></header>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs" hidden></nav>
<div class="sheet" id="sheet" hidden></div>
<div class="viewer" id="viewer" hidden><div class="vbar"><b id="vname"></b><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span id="vfill" role="status"></span><button class="btn ghost small" id="vnext" hidden>Case vide suivante</button><button class="btn small" id="vedit" hidden>Remplir</button><button class="btn small" id="vsave" hidden>Enregistrer</button><button class="btn ghost small" id="vclose">Fermer</button></span></div><div class="pages" id="vpages"></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="outil/shim.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
"use strict";
if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add("embed");
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let sb,me,role="lecteur",profils=[],chantiers=new Map(),week,tab,openId=null;
let tT;function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(tT);tT=setTimeout(()=>e.hidden=true,3500)}

// ---------- dates (heure locale) ----------
const JOURS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function isoWeek(d){const t=new Date(d.getFullYear(),d.getMonth(),d.getDate());t.setDate(t.getDate()+3-(t.getDay()+6)%7);const w1=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-w1)/864e5-3+(w1.getDay()+6)%7)/7)}
const dayLabel=s=>{const d=parse(s);return JOURS[(d.getDay()+6)%7]+" "+d.getDate()+" "+MOIS[d.getMonth()]};
const today=()=>iso(new Date());
const weekDays=()=>Array.from({length:7},(_,i)=>iso(addDays(week,i)));
const hfmt=n=>{const h=Math.floor(n+1e-9),m=Math.round((n-h)*60);return h+"h"+(m?String(m).padStart(2,"0"):"")};
const tmin=t=>{if(!t)return null;const[h,m]=t.split(":").map(Number);return h*60+m};

// ---------- données ----------
const nameOf=id=>{const p=profils.find(x=>x.id===id);return p?(p.nom||(p.email||"").split("@")[0]):"?"};
const poseurs=()=>profils.filter(p=>p.role==="poseur").sort((a,b)=>nameOf(a.id).localeCompare(nameOf(b.id)));
const jobName=id=>{const j=chantiers.get(id);return j?(j.client||id):id};
const jobShort=id=>jobName(id).split(" - ")[0];
const addrOf=j=>{const a=(j.adresse||"").trim(),v=(j.ville||"").trim();return a&&v&&a.toLowerCase().includes(v.toLowerCase())?a:[a,v].filter(Boolean).join(", ")};
async function loadChantiers(){
  const{data,error}=await sb.from("chantiers").select("id,data");if(error)throw error;
  chantiers=new Map(data.map(r=>[r.id,r.data||{}]));
}
async function q(p){const{data,error}=await p;if(error)throw error;return data}
const loadPlanning=(a,b)=>q(sb.from("planning").select("*").gte("jour",a).lte("jour",b).order("jour"));
const loadHeures=(a,b)=>q(sb.from("heures").select("*").gte("jour",a).lte("jour",b).order("jour").order("debut"));

// ---------- navigation ----------
const TABS={poseur:[["planning","Mon planning"],["stockphoto","Stock"],["heures","Mes heures"]], // onglet Stock : photos des consommables (Steven, 09/11/2026)
  editeur:[["gplanning","Planning"],["gheures","Heures"],["gphotos","Photos"]],
  autre:[["gplanning","Planning"],["gphotos","Photos"]]};
function tabsFor(){return TABS[role==="poseur"?"poseur":role==="editeur"?"editeur":"autre"]}
// ancre #planning / #heures / #photos : ouvre directement l'onglet correspondant au rôle
function fromHash(){const h=location.hash.slice(1),ks=tabsFor().map(t=>t[0]);return ks.find(k=>k===h)||ks.find(k=>k==="g"+h)||null}
function setTab(t){tab=t;try{localStorage.setItem("poseurs.tab",t)}catch(_){}
  $("tabs").innerHTML=tabsFor().map(([k,l])=>`<button type="button" data-tab="${k}" aria-pressed="${k===t}">${l}</button>`).join("");render()}
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)setTab(b.dataset.tab)});
function weekNav(){return`<div class="weeknav"><button class="btn ghost" data-week="-1" aria-label="Semaine précédente">◀</button>
  <b>Semaine ${isoWeek(week)}<br><span class="sub">${week.getDate()} ${MOIS[week.getMonth()]} – ${addDays(week,6).getDate()} ${MOIS[addDays(week,6).getMonth()]}</span></b>
  <button class="btn ghost" data-week="1" aria-label="Semaine suivante">▶</button></div>
  ${iso(week)!==iso(monday(new Date()))?`<div style="text-align:center"><button class="btn ghost small" data-week="0">Revenir à cette semaine</button></div>`:""}`}
document.addEventListener("click",e=>{const b=e.target.closest("[data-week]");if(!b)return;
  const n=+b.dataset.week;week=n?addDays(week,7*n):monday(new Date());render()});

// question posée par Claude à une personne (réponse déposée dans documents/claude/reponses/, relue par Claude)
const QUESTIONS=[{id:"heures-marine",pour:"m.renault@mgds.fr",
  q:"Bonjour Marine, c'est Claude. Les poseurs notent maintenant leurs heures ici. Comment veux-tu que je te les transmette pour les salaires ?",
  choix:["Je les regarde moi-même dans l'appli (onglet Heures) et je télécharge le fichier Excel quand j'en ai besoin",
    "Claude me dépose chaque fin de mois un fichier Excel sur le serveur (par poseur et par jour)",
    "Claude me dépose un fichier Excel chaque semaine sur le serveur"],
  detail:"Précisions (facultatif) : heures par chantier ou total par jour, dossier du serveur, format de ton logiciel de paie…"}];
let qDone=null;
async function questionCard(){
  const me_=profils.find(p=>p.id===me)||{},Q=QUESTIONS.find(x=>x.pour===me_.email);if(!Q)return"";
  if(qDone===null){try{const{data}=await sb.storage.from("documents").list("claude/reponses",{search:Q.id});qDone=!!(data&&data.length)}catch(_){qDone=false}}
  if(qDone)return"";
  return`<div class="box" id="qcard" style="border-left:6px solid var(--accent);margin-top:14px"><h3>Une question de Claude</h3><p style="margin:0 0 8px">${esc(Q.q)}</p>
   ${Q.choix.map((c,i)=>`<label style="display:flex;gap:10px;align-items:flex-start;margin:8px 0;cursor:pointer"><input type="radio" name="qchoix" value="${i}" style="width:22px;height:22px;flex:none;margin-top:2px"><span>${esc(c)}</span></label>`).join("")}
   <label class="fld">${esc(Q.detail)}<textarea id="qdetail" rows="3" style="font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%"></textarea></label>
   <div class="acts"><button class="btn" data-qsend="${Q.id}">Envoyer ma réponse à Claude</button></div></div>`;
}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-qsend]");if(!b)return;
  const c=document.querySelector("[name=qchoix]:checked"),d=($("qdetail")?.value||"").trim();
  if(!c&&!d){toast("Choisissez une réponse ou écrivez quelques mots.");return}
  const Q=QUESTIONS.find(x=>x.id===b.dataset.qsend),rep={question:Q.q,choix:c?Q.choix[+c.value]:null,precisions:d||null,par:nameOf(me),le:new Date().toISOString()};
  b.disabled=true;
  const{error}=await sb.storage.from("documents").upload(`claude/reponses/${Q.id}-${Date.now()}.json`,new Blob([JSON.stringify(rep,null,1)],{type:"application/json"}),{contentType:"application/json"});
  b.disabled=false;if(error){toast("Envoi impossible. Réessayez.");return}
  qDone=true;$("qcard")?.remove();toast("Merci ! Claude a bien reçu ta réponse.");
});

// photos : réduites (1600 px, JPEG) avant l'envoi pour rester dans l'espace gratuit
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=url});
    const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(ok=>c.toBlob(ok,"image/jpeg",.72));
  }catch(_){return file.type==="image/jpeg"&&file.size<5e6?file:null}
  finally{URL.revokeObjectURL(url)}
}

function clean(s){return (s||"").trim().replace(/[’‘]/g,"'").replace(/œ/g,"oe").replace(/Œ/g,"OE")}
async function withAddress(blob,j){
  const vals=[["adresse_chantier",clean(addrOf(j).replace(", "," - ")),0],["client_nom",clean(j.clientNom),1],["client_adresse",clean(j.clientAdresse),0]].filter(v=>v[1]);
  if(!vals.length||!window.PDFLib)return blob;
  try{const doc=await PDFLib.PDFDocument.load(await blob.arrayBuffer());const all=doc.getForm().getFields();
    const fs=vals.flatMap(([n,v,b])=>all.filter(f=>f.getName().startsWith(n+"_")).map(f=>[f,v,b]));if(!fs.length)return blob;
    const font=await doc.embedFont(PDFLib.StandardFonts.Helvetica),bold=await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);
    fs.forEach(([f,v,b])=>{f.setText(v);f.setFontSize(8);f.updateAppearances(b?bold:font)});
    return new Blob([await doc.save()],{type:"application/pdf"});
  }catch(_){return blob}
}

async function startFill(){

  const big=vPages[0].box.clientWidth<800;if(big)$("vpages").style.alignItems="flex-start";
  for(const [pi,P] of vPages.entries()){
    if(big){const v0=P.page.getViewport({scale:1}),w=900;P.css=w/v0.width;P.vp=P.page.getViewport({scale:P.css*(window.devicePixelRatio||1)});
      P.c.width=P.vp.width;P.c.height=P.vp.height;P.c.style.width=w+"px";P.c.style.maxWidth="none";P.box.style.width=w+"px";P.box.style.maxWidth="none";P.box.style.flex="none"}
    const anns=(await P.page.getAnnotations({intent:"display"})).filter(a=>a.subtype==="Widget"&&a.fieldName&&(a.fieldType==="Tx"||(a.fieldType==="Btn"&&a.checkBox)));
    const vpc=P.page.getViewport({scale:P.css});
    await P.page.render({canvasContext:P.c.getContext("2d"),viewport:P.vp,annotationMode:pdfjsLib.AnnotationMode.DISABLE}).promise;
    for(const a of anns){
      const [x1,y1,x2,y2]=vpc.convertToViewportRectangle(a.rect),L=Math.min(x1,x2),T=Math.min(y1,y2),W=Math.abs(x2-x1),H=Math.abs(y2-y1);
      if(/^(client_nom|client_adresse|adresse_chantier)_/.test(a.fieldName)){
        // nom et adresses : écrits depuis la fiche chantier, affichés tels quels
        if(a.fieldValue){const t=document.createElement("div");t.className="fldro";t.textContent=a.fieldValue;Object.assign(t.style,{left:L+"px",top:T+"px",width:W+"px",fontSize:8*P.css+"px",fontWeight:/^client_nom/.test(a.fieldName)?"700":"400"});P.box.appendChild(t)}
        continue}
      const cb=a.fieldType==="Btn",multi=!cb&&Math.abs(a.rect[3]-a.rect[1])>45;
      const el=document.createElement(multi?"textarea":"input");el.className="fld";
      if(cb){el.type="checkbox";el.checked=!!a.fieldValue&&a.fieldValue!=="Off"}else{if(!multi)el.type="text";el.value=a.fieldValue||"";el.style.fontSize=Math.max(9,Math.min(16,H*.68))+"px"}
      Object.assign(el.style,{left:L+"px",top:T+"px",width:W+"px",height:H+"px"});el.setAttribute("aria-label",a.alternativeText||a.fieldName);
      P.box.appendChild(el);

    }

  }

  const cbs=fields.filter(f=>f.cb);
  // une ligne de cases se découpe en groupes à chaque libellé « xxx : » (ex. Habillage : … Sens : …) ; options de l'annexe groupées par page
  let gn=0;

  rest.forEach((f,k)=>{const g=rest.slice(0,k).reverse().find(o=>near(f,o));

  // texte obligatoire, sauf remarques, grands cadres, et petit champ collé juste après une case (« autre : … », nombre de grilles, remarque d'un contrôle)
  fields.forEach(f=>{if(!f.cb)f.req=!f.multi&&!/^rem_/.test(f.name)&&!cbs.some(g=>!/^opt_/.test(g.name)&&near(f,g)&&g.x<f.x&&f.x-g.x<40)});
  fields.forEach(f=>{if(!f.cb&&!f.req)f.el.classList.add("opt")});
  vForm={fields,dirty:false,saving:false};

// enregistre la fiche remplie : nouveau PDF dans le stockage, puis remplacement du document dans le chantier (relu juste avant, sans écraser le reste)
async function saveFill(){
  if(!vForm||vForm.saving)return;const id=vJob,d0=vDoc;if(!id||!d0)return;
  vForm.saving=true;$("vsave").disabled=true;toast("Enregistrement de la fiche…");
  try{
    const doc=await PDFLib.PDFDocument.load(await vBlob.arrayBuffer());const form=doc.getForm();
    const font=await doc.embedFont(PDFLib.StandardFonts.Helvetica);
    for(const f of vForm.fields){try{
      if(f.cb){const c=form.getCheckBox(f.name);f.el.checked?c.check():c.uncheck()}
      else form.getTextField(f.name).setText(f.el.value.replace(/[^\x20-\x7E\xA0-\xFF\n€œŒ’‘“”–—…]/g,""))
    }catch(_){}}
    form.updateFieldAppearances(font);
    const bytes=await doc.save();
    const safe=d0.name.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w.-]+/g,"_").slice(-80);
    const path=`poseurs/${me}/${Date.now().toString(36)}-${safe}`;
    const up=await sb.storage.from("documents").upload(path,new Blob([bytes],{type:"application/pdf"}),{contentType:"application/pdf",upsert:false});
    if(up.error)throw up.error;
    const k=FILLABLE[d0.type],rempli={reste:vForm.reste,total:vForm.total,le:today()};
    let done=false,cocher=false;
    for(let n=0;n<6&&!done;n++){
      const{data:row,error:e1}=await sb.from("chantiers").select("data,version").eq("id",id).single();if(e1)throw e1;
      const data=row.data||{},docs=(data.docs||[]).map(x=>({...x}));
      const i=docs.findIndex(x=>x.id===d0.id);if(i<0)throw new Error("fiche introuvable");
      docs[i]={...docs[i],id:path,size:bytes.length,at:today(),by:me,traite:false,rempli};
      const steps={...(data.steps||{})};cocher=!!(k&&vForm.reste===0&&!(steps[k]&&steps[k].d));
      if(cocher)steps[k]={d:today(),by:me};
      const{data:upd,error:e2}=await sb.from("chantiers").update({data:{...data,docs,steps}}).eq("id",id).eq("version",row.version).select("id");
      if(e2)throw e2;done=!!(upd&&upd.length);
      if(done){chantiers.set(id,{...data,docs,steps});vDoc=docs[i]}
    }
    if(!done)throw new Error("conflit");
    vBlob=new Blob([bytes],{type:"application/pdf"});vForm.dirty=false;
    toast(vForm.reste?`Fiche enregistrée. Il reste ${vForm.reste} case${vForm.reste>1?"s":""} à remplir.`:cocher?"Fiche complète et enregistrée ✓ L'étape est cochée dans l'appli.":"Fiche complète et enregistrée ✓");
    if(openId===id)renderSheet();
  }catch(e){console.error(e);toast("La fiche n'a pas pu être enregistrée. Vérifiez le réseau et réessayez.")}
  finally{if(vForm)vForm.saving=false;$("vsave").disabled=false}
}

        return`<td>${cells}${ed?`<button class="add" data-padd="eq${eq.k}|${d}" aria-label="Placer l'équipe">+</button>`:""}</td>`}).join("")}</tr>`}).join("");
  }else{
    const people=[...ps,...EQUIPES[2].chefs.map(e=>profils.find(p=>p.email===e)).filter(Boolean)];
    body=people.map(p=>`<tr><td class="name">${esc(nameOf(p.id))}</td>${cols.map(d=>`<td>${(jourCell=d,pl.filter(x=>x.poseur===p.id&&x.jour===d)).map(x=>chip(labOf(x),x.note,[x.id],x.chantier,isAtel(x.note))).join("")}
     ${ed?`<button class="add" data-padd="${p.id}|${d}" aria-label="Ajouter un chantier">+</button>`:""}</td>`).join("")}</tr>`).join("");
  }
  v.innerHTML=weekNav()+`<div class="chips"><button class="chip" data-gvue="equipe" aria-pressed="${gVue==="equipe"}">Par équipe</button><button class="chip" data-gvue="personne" aria-pressed="${gVue==="personne"}">Par personne</button></div>`
   +(ps.length?`<div class="gridwrap"><table class="plan">${head}<tbody>${body}${A.length?atlRow:""}</tbody></table></div>${A.some(x=>pl.some(p=>p.jour>=t&&p.chantier===x.chantier&&!x.fait&&x.fin>=p.jour))?`<p class="sub"><span class="pchip pret" style="display:inline-flex">⚠</span> pose prévue avant la fin de fabrication à l'atelier.</p>`:""}${ed?`<p class="sub">Touchez « + » pour placer une équipe (ou une personne) sur un chantier. Chacun voit sur son téléphone les chantiers où vous l'avez placé, avec les fiches.</p>`:""}`
   :`<div class="empty" style="margin-top:16px">Aucun poseur n'a encore d'accès.</div>`);
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-gvue]");if(b){gVue=b.dataset.gvue;render()}});
document.addEventListener("click",async e=>{
  const d=e.target.closest("[data-pdel]");if(d){
    const{error}=await sb.from("planning").delete().in("id",d.dataset.pdel.split(","));if(error){toast("Modification impossible.");return}render();return}
  const a=e.target.closest("[data-padd]");if(!a)return;
  const[who,day]=a.dataset.padd.split("|");
  const eq=who.startsWith("eq")?EQUIPES.find(x=>"eq"+x.k===who):null;
  const ids=[...chantiers.keys()].filter(i=>!(chantiers.get(i).steps||{}).recep||i===openId).sort((x,y)=>jobName(x).localeCompare(jobName(y)));
  const m=modal(`<h2>${esc(eq?eq.l:nameOf(who))} · ${esc(dayLabel(day))}</h2>
   ${eq?`<div class="sub">${eq.m.map(idOf).filter(Boolean).map(shortName).join(", ")}</div>`:""}
   ${eq&&eq.chefs?`<label class="fld">Avec<select name="chef">${eq.chefs.map(idOf).filter(Boolean).map(id=>`<option value="${id}">${esc(shortName(id))}</option>`).join("")}</select></label>`:""}
   <label class="fld">Chantier<select name="c"><option value="">Choisir…</option>${ids.map(i=>`<option value="${esc(i)}">${esc(jobName(i))}</option>`).join("")}</select></label>
   <label class="fld">ou texte libre (chantier pas encore dans l'appli, congé, atelier…)<input type="text" name="lib" placeholder="ex. BLAISE, CONGÉ, ATELIER"></label>
   <label class="fld">Consigne (facultatif)<input type="text" name="note" placeholder="ex. RDV 8h, prendre l'échafaudage"></label>
   <label class="fld" style="display:flex;gap:10px;align-items:center;font-weight:500"><input type="checkbox" name="suite" style="width:22px;height:22px;min-height:0"> Jusqu'à la fin de la semaine (jusqu'au vendredi)</label>
   <div class="acts"><button class="btn ghost" data-x>Annuler</button><button class="btn" data-ok>Placer</button></div>`);
  m.querySelector("[data-x]").onclick=()=>m.close();
  m.querySelector("[data-ok]").onclick=async()=>{
    const c=m.querySelector("[name=c]").value||null,lib=m.querySelector("[name=lib]").value.trim()||null;if(!c&&!lib){toast("Choisissez le chantier ou écrivez un texte.");return}
    const note=m.querySelector("[name=note]").value.trim()||null;
    const pids=eq?[...eq.m.map(idOf).filter(Boolean),...(eq.chefs?[m.querySelector("[name=chef]").value]:[])]:[who];
    let ds=[day];if(m.querySelector("[name=suite]").checked){const d0=parse(day);for(let x=addDays(d0,1);(x.getDay()+6)%7<5;x=addDays(x,1))ds.push(iso(x))}
    const rows=ds.flatMap(j=>pids.map(pid=>({jour:j,chantier:c,poseur:pid,note,...(c?{}:{libelle:lib})})));
    const{error}=c?await sb.from("planning").upsert(rows,{onConflict:"jour,chantier,poseur"}):await sb.from("planning").insert(rows);
    if(error){toast("Enregistrement impossible.");return}
    m.close();toast("Planning enregistré ✓");render();
  };
});

// ---------- gestion : heures (Marine) ----------
let gMode="semaine";
async function vGHeures(v){
  const days=weekDays();let a=days[0],b=days[6],titre;
  if(gMode==="mois"){const d=addDays(week,3);a=iso(new Date(d.getFullYear(),d.getMonth(),1));b=iso(new Date(d.getFullYear(),d.getMonth()+1,0));titre=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"][d.getMonth()]+" "+d.getFullYear()}
  const hs=await loadHeures(a,b),ps=[...new Set([...poseurs().map(p=>p.id),...hs.map(h=>h.poseur)])];
  v._heures=hs;v._range=[a,b];
  const nv=hs.filter(h=>!h.valide_le).length;
  v.innerHTML=weekNav()+`<div class="chips"><button class="chip" data-gmode="semaine" aria-pressed="${gMode==="semaine"}">Cette semaine</button><button class="chip" data-gmode="mois" aria-pressed="${gMode==="mois"}">Tout le mois${titre?" ("+titre+")":""}</button></div>
   <div class="links"><button class="btn" data-export>Télécharger pour Excel</button>${nv?`<button class="btn ghost" data-valall>Valider les ${nv} ligne${nv>1?"s":""} affichée${nv>1?"s":""}</button>`:""}</div>
   ${ps.length?ps.map(pid=>{const L=hs.filter(h=>h.poseur===pid),tot=L.reduce((s,h)=>s+(+h.heures||0),0);
     return`<h3>${esc(nameOf(pid))} · ${hfmt(tot)}</h3>${L.length?`<div class="gridwrap"><table class="h"><thead><tr><th>Jour</th><th>Chantier</th><th>Arrivée</th><th>Départ</th><th class="n">Pause</th><th class="n">Heures</th><th>Remarque</th><th></th></tr></thead><tbody>
      ${L.map(h=>`<tr><td>${esc(dayLabel(h.jour))}</td><td>${esc(hLab(h))}</td><td>${(h.debut||"").slice(0,5)}</td><td>${(h.fin||"").slice(0,5)}</td><td class="n">${h.pause_min||0}</td><td class="n">${hfmt(+h.heures)}</td><td>${esc(h.note||"")}</td>
        <td>${h.valide_le?'<span class="tag">validé ✓</span>':'<span class="tag o">à valider</span>'} <button class="btn ghost small" data-hedit="${h.id}">Modifier</button></td></tr>`).join("")}
      <tr class="sum"><td colspan="5">Total</td><td class="n">${hfmt(tot)}</td><td colspan="2"></td></tr></tbody></table></div>`:`<p class="none">Aucune heure saisie.</p>`}`}).join("")
   :`<div class="empty">Aucun poseur n'a encore d'accès.</div>`}`;
}
document.addEventListener("click",async e=>{
  const m=e.target.closest("[data-gmode]");if(m){gMode=m.dataset.gmode;render();return}
  if(e.target.closest("[data-valall]")){
    const ids=($("view")._heures||[]).filter(h=>!h.valide_le).map(h=>h.id);
    const{error}=await sb.from("heures").update({valide_le:new Date().toISOString(),valide_par:me}).in("id",ids);
    toast(error?"Validation impossible.":"Heures validées ✓");render();return}
  if(e.target.closest("[data-export]")){
    const hs=$("view")._heures||[],[a,b]=$("view")._range;
    const cell=s=>{s=String(s??"");return/[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
    const rows=[["Poseur","Date","Jour","Chantier","Arrivée","Départ","Pause (min)","Heures","Remarque","Validé"]]
      .concat(hs.slice().sort((x,y)=>nameOf(x.poseur).localeCompare(nameOf(y.poseur))||x.jour.localeCompare(y.jour))
      .map(h=>[nameOf(h.poseur),h.jour.split("-").reverse().join("/"),JOURS[(parse(h.jour).getDay()+6)%7],hLabLong(h),(h.debut||"").slice(0,5),(h.fin||"").slice(0,5),h.pause_min||0,String(h.heures).replace(".",","),hRem(h),h.valide_le?"oui":"non"]));
    const blob=new Blob(["﻿"+rows.map(r=>r.map(cell).join(";")).join("\r\n")],{type:"text/csv;charset=utf-8"});
    const l=document.createElement("a");l.href=URL.createObjectURL(blob);l.download=`heures-poseurs-${a}-au-${b}.csv`;document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(l.href);l.remove()},1000);
  }
});

// ---------- gestion : photos ----------
let gCat="",gJob="";
async function vGPhotos(v){
  let qy=sb.from("photos").select("*").order("pris_le",{ascending:false}).limit(120);
  if(gCat)qy=qy.eq("categorie",gCat);if(gJob)qy=qy.eq("chantier",gJob);
  const ph=await q(qy),urls=await signed(ph.map(p=>p.chemin));
  const ids=[...chantiers.keys()].sort((a,b)=>jobName(a).localeCompare(jobName(b)));
  v.innerHTML=`<h2>Photos des chantiers</h2>
   <label class="fld">Chantier<select id="gjob"><option value="">Tous les chantiers</option>${ids.map(i=>`<option value="${esc(i)}" ${i===gJob?"selected":""}>${esc(jobName(i))}</option>`).join("")}</select></label>
   <div class="chips"><button class="chip" data-gcat="" aria-pressed="${!gCat}">Toutes</button>${CATS.map(([k,l])=>`<button class="chip" data-gcat="${k}" aria-pressed="${gCat===k}">${l.replace("Photos ","")}</button>`).join("")}</div>
   <div data-photos-scope>${ph.length?`<div class="thumbs" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">${ph.map(p=>`<button data-photo="${p.id}">${urls[p.chemin]?`<img src="${esc(urls[p.chemin])}" alt="" loading="lazy">`:""}<span class="cap">${esc(jobShort(p.chantier))} · ${esc(nameOf(p.poseur))} · ${esc(fmtTs(p.pris_le))}</span></button>`).join("")}</div>`:`<div class="empty">Aucune photo pour le moment.</div>`}</div>`;
  const sc=v.querySelector("[data-photos-scope]");sc._photos=ph;sc._urls=urls;
  $("gjob").onchange=e=>{gJob=e.target.value;render()};
}
document.addEventListener("click",e=>{const c=e.target.closest("[data-gcat]");if(c){gCat=c.dataset.gcat;render()}});

// ---------- démarrage ----------
(async()=>{
  await claude.use("user");sb=window.sbClient;
  const{data:{session}}=await sb.auth.getSession();me=session.user.id;
  profils=(await sb.from("profils").select("id,email,nom,role")).data||[];
  role=(profils.find(p=>p.id===me)||{}).role||"lecteur";
  // accès par poste (Steven, 09/11/2026) : l'atelier (Christophe, Manu) n'a que l'appli principale (Atelier + Stock)
  if(role==="atelier"){location.replace("index.html");return}
  // hors poseurs, l'espace poseurs ne s'ouvre que dans l'onglet Planning de l'appli principale (Yannick tombait sur la page poseurs avec un ancien raccourci, 09/11/2026)
  if(role!=="poseur"&&!document.documentElement.classList.contains("embed")){location.replace("index.html");return}
  const p=profils.find(x=>x.id===me)||{};
  $("hello").textContent="Bonjour "+(p.nom||(p.email||"").split("@")[0]);
  $("app").hidden=false;$("tabs").hidden=false;week=monday(new Date());
  try{await loadChantiers()}catch(_){}
  let saved;try{saved=localStorage.getItem("poseurs.tab")}catch(_){}
  setTab(fromHash()||(tabsFor().some(t=>t[0]===saved)?saved:tabsFor()[0][0]));
  window.addEventListener("hashchange",()=>{const t=fromHash();if(t&&t!==tab){if(openId)closeSheet();setTab(t)}});
  document.addEventListener("visibilitychange",async()=>{if(document.hidden)return;try{await loadChantiers()}catch(_){}if(openId)renderSheet();else render()});
})();
</script>
