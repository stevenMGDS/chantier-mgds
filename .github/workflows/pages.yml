name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Ne publier que les fichiers de l'appli (pas outil/*.sql, scripts, README)
      - name: Préparer _site
        run: |
          mkdir -p _site/outil
          cp index.html poseurs.html plan-stock.html \
             manifest.json manifest-poseurs.json \
             icon.svg icon-180.png icon-512.png .nojekyll _site/
          cp outil/shim.js _site/outil/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
